<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Eurovision Quiz - Nickname</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 rounded-xl p-8 shadow-2xl border border-slate-700">
        <h2 class="text-2xl font-bold mb-6 text-center text-purple-400">Identificação do Jogador</h2>
        
        {% if erro %}
            <div class="bg-red-500/20 border border-red-500 text-red-300 p-3 rounded mb-4 text-sm">
                {{ erro }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('novo_jogo') }}" class="space-y-4">
            <div>
                <label for="nickname" class="block text-sm font-medium mb-1 text-slate-300">Digite seu Nickname:</label>
                <input type="text" id="nickname" name="nickname" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-purple-500 text-white">
            </div>
            <button type="submit" class="w-full py-3 bg-purple-600 hover:bg-purple-500 rounded-lg font-bold transition">
                Iniciar Partida
            </button>
        </form>
    </div>
</body>
</html>
