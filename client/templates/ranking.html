<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Eurovision Quiz - Ranking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 rounded-xl p-8 shadow-2xl border border-slate-700">
        <h2 class="text-2xl font-bold mb-6 text-center text-yellow-400">Top 10 Vencedores</h2>
        
        <table class="w-full text-left mb-6">
            <thead>
                <tr class="border-b border-slate-700 text-slate-400 text-sm">
                    <th class="pb-2">#</th>
                    <th class="pb-2">Nickname</th>
                    <th class="pb-2 text-right">Pontuação</th>
                </tr>
            </thead>
            <tbody>
                {% for item in ranking %}
                <tr class="border-b border-slate-700/50">
                    <td class="py-2 text-slate-400">{{ loop.index }}</td>
                    <td class="py-2 font-semibold">{{ item.nickname }}</td>
                    <td class="py-2 text-right text-green-400 font-bold">{{ item.pontuacao }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="{{ url_for('index') }}" class="block w-full text-center py-3 bg-slate-700 hover:bg-slate-600 rounded-lg font-semibold transition">
            Voltar ao Início
        </a>
    </div>
</body>
</html>
